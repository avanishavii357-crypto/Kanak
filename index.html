<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanak I'm Sorry 😔</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating hearts */
        .hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.6);
            animation: float 6s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(100vh) rotate(0deg); 
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { 
                transform: translateY(-100px) rotate(360deg); 
                opacity: 0;
            }
        }

        /* Main card */
        .card {
            position: relative;
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: cardEnter 1s ease-out;
            z-index: 1;
        }

        @keyframes cardEnter {
            0% {
                opacity: 0;
                transform: scale(0.5) translateY(50px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Glow effect */
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            border-radius: 32px;
            z-index: -1;
            filter: blur(20px);
            opacity: 0.5;
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            0% { opacity: 0.3; }
            100% { opacity: 0.7; }
        }

        /* Emoji */
        .emoji {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Title */
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: white;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            animation: fadeIn 1s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Subtitle */
        .subtitle {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 30px;
            line-height: 1.8;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        /* Message box */
        .message-box {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 25px;
            margin: 20px 0;
            animation: fadeIn 1s ease-out 0.7s both;
        }

        .message-box p {
            color: white;
            font-size: 1.05rem;
            line-height: 1.7;
            font-style: italic;
        }

        /* Button */
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: white;
            color: #e73c7e;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            text-decoration: none;
            animation: fadeIn 1s ease-out 0.9s both;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Sparkles */
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: sparkle 1.5s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1); opacity: 1; }
        }

        /* Blinking dot animation */
        .dots {
            display: inline-block;
        }

        .dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body>

    <!-- Floating hearts background -->
    <div class="hearts" id="hearts"></div>

    <!-- Main card -->
    <div class="card">
        <div class="emoji">😔</div>
        
        <h1>I'm Really Sorry Kanak</h1>
        
        <p class="subtitle">
            I messed up, and I feel terrible about it<span class="dots"></span>
        </p>

        <div class="message-box">
            <p id="sorryText">
               "Meri galti ne tumhe hurt kiya. 
                Main sincerely sorry bolta hoon. 
                Main innconce nahi ban raha hu please gussa mat hona , Aur kitna bhao kahogi lays kaho 
                Please forgive me Kanak"
            </p>
        </div>

        <a href="#" class="btn" onclick="showLove()">Thik h </a>
    </div>

    <script>
        // Create floating hearts
        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            const heartSymbols = ['❤️', '💕', '💖', '💗', '😍', '🥺'];
            
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.fontSize = (15 + Math.random() * 25) + 'px';
                    heart.style.animationDuration = (4 + Math.random() * 4) + 's';
                    heart.style.animationDelay = Math.random() * 2 + 's';
                    heartsContainer.appendChild(heart);
                }, i * 300);
            }
        }

        // Button click - show love
        function showLove() {
            const btn = document.querySelector('.btn');
            const emoji = document.querySelector('.emoji');
            
            btn.innerHTML = 'I am sorry kanak!';
            btn.style.background = '#ff9ff3';
            btn.style.color = 'white';
            
            emoji.innerText = '🥰';
            emoji.style.animation = 'heartBeat 0.5s ease-in-out infinite';
            
            // Create celebration
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    createParticle();
                }, i * 50);
            }
        }

        function createParticle() {
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#ffffff'];
            const particle = document.createElement('div');
            particle.className = 'sparkle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = 50 + '%';
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            particle.style.width = (5 + Math.random() * 15) + 'px';
            particle.style.height = particle.style.width;
            
            // Animate
            const angle = Math.random() * Math.PI * 2;
            const velocity = 3 + Math.random() * 5;
            const vx = Math.cos(angle) * velocity;
            const vy = Math.sin(angle) * velocity - 5;
            
            let x = 0, y = 0;
            const anim = particle.animate([
                { transform: 'translate(0, 0)', opacity: 1 },
                { transform: `translate(${vx * 50}px, ${vy * 50}px)`, opacity: 0 }
            ], {
                duration: 1000,
                easing: 'ease-out'
            });
            
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 1000);
        }

        // Add heartbeat animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes heartBeat {
                0% { transform: scale(1); }
                25% { transform: scale(1.2); }
                50% { transform: scale(1); }
                75% { transform: scale(1.2); }
                100% { transform: scale(1); }
            }
        `;
        document.head.appendChild(style);

        // Initialize
        createHearts();
    </script>
</body>
</html>
